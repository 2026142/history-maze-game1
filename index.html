function shuffle(array) {
  const a = array.slice();
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeMaze() {
  SIZE = 31 + (stage-1)*2;
  TILE = canvas.width / SIZE;
  maze = Array.from({length:SIZE},()=>Array(SIZE).fill(1));
  const stack=[[1,1]];
  maze[1][1]=0;
  const dirs=[[0,-2],[0,2],[-2,0],[2,0]];

  while(stack.length) {
    const [x,y]=stack[stack.length-1];
    const shuffled=shuffle(dirs);
    let moved=false;
    for(const [dx,dy] of shuffled) {
      const nx=x+dx, ny=y+dy;
      if(nx>0 && nx<SIZE-1 && ny>0 && ny<SIZE-1 && maze[ny][nx]===1) {
        maze[y+dy/2][x+dx/2]=0;
        maze[ny][nx]=0;
        stack.push([nx,ny]);
        moved=true;
        break;
      }
    }
    if(!moved) stack.pop();
  }
  player={x:1,y:1};
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<SIZE;y++) {
    for(let x=0;x<SIZE;x++) {
      ctx.fillStyle=maze[y][x]===1 ? "#263238" : "#f5f5f5";
      ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
    }
  }

  ctx.fillStyle="#d32f2f";
  ctx.fillRect((SIZE-2)*TILE,(SIZE-2)*TILE,TILE,TILE);
  ctx.fillStyle="#fff";
  ctx.font=`bold ${Math.max(9,TILE*.65)}px Arial`;
  ctx.fillText("D",(SIZE-2)*TILE+TILE*.25,(SIZE-2)*TILE+TILE*.75);

  ctx.fillStyle="#a5d6a7";
  ctx.fillRect(TILE,TILE,TILE,TILE);

  ctx.fillStyle="#1565c0";
  ctx.beginPath();
  ctx.arc(player.x*TILE+TILE/2,player.y*TILE+TILE/2,TILE*.36,0,Math.PI*2);
  ctx.fill();
}

function updateInfo() {
  timerEl.textContent=timeLeft;

  stageEl.textContent=stage+" / "+MAX_STAGE;
  progressEl.textContent=questionIndex+" / 5";
}

function move(dx,dy) {
  if(gameOver || won || inQuiz) return;
  const nx=player.x+dx, ny=player.y+dy;
  if(nx<0 || ny<0 || nx>=SIZE || ny>=SIZE || maze[ny][nx]===1) return;
  player.x=nx;
  player.y=ny;
  draw();
  if(nx===SIZE-2 && ny===SIZE-2) startQuiz();
}

function startMovement() {
  if(moveInterval) clearInterval(moveInterval);
  moveInterval=setInterval(()=>{
    if(inQuiz || gameOver || won) return;
    let dx=0,dy=0;
    if(keys.ArrowUp || keys.w || keys.W) dy=-1;
    else if(keys.ArrowDown || keys.s || keys.S) dy=1;
    else if(keys.ArrowLeft || keys.a || keys.A) dx=-1;
    else if(keys.ArrowRight || keys.d || keys.D) dx=1;
    if(dx!==0 || dy!==0) move(dx,dy);
  },Math.max(65,115-(stage-1)*5));
}

function startTimer() {
  if(timerId) clearInterval(timerId);
  timerId=setInterval(()=>{
    if(gameOver || won) return;
    timeLeft--;
    updateInfo();
    if(timeLeft<=0) endGame("제한 시간이 종료되었습니다!");
  },1000);
}

function newQuestionSet() {
  quizSet=shuffle(questionStages[stage-1]).slice(0,5);
  questionIndex=0;
}

function startQuiz() {
  if(inQuiz || gameOver || won) return;
  inQuiz=true;
  keys={};
  newQuestionSet();
  quizEl.style.display="block";
  messageEl.textContent="출구를 열기 위해 문제 5개를 맞혀야 합니다!";
  showQuestion();
}

function showQuestion() {
  if(questionIndex>=5) {
    stageClear();
    return;
  }
  updateInfo();
  const q=quizSet[questionIndex];

  const shuffledChoices=shuffle(q.c.map((choice,index)=>({
    text:choice,
    correct:index===q.a
  })));

  questionTitle.textContent=`스테이지 ${stage} - 문제 ${questionIndex+1} / 5`;
  questionText.textContent=q.q;
  feedbackEl.textContent="";
  choicesEl.innerHTML="";

  shuffledChoices.forEach((choice,index)=>{
    const button=document.createElement("button");
    button.className="choice";
    button.textContent=String.fromCharCode(65+index)+". "+choice.text;
    button.onclick=()=>answerQuestion(choice.correct,q);
    choicesEl.appendChild(button);
  });
}

function answerQuestion(correct,q) {
  if(!inQuiz || gameOver || won) return;
  choicesEl.querySelectorAll("button").forEach(b=>b.disabled=true);

  if(correct) {
    feedbackEl.textContent="정답입니다!\n"+q.e;
    questionIndex++;
    updateInfo();
    feedbackTimeout=setTimeout(()=>{
      if(questionIndex>=5) stageClear();
      else showQuestion();
    },1600);
  } else {
    lives--;
    updateInfo();
    feedbackEl.textContent="오답입니다!\n정답: "+q.c[q.a]+"\n"+q.e+
      (lives>0 ? "\n새로운 문제 세트로 다시 도전하세요." : "");
    feedbackTimeout=setTimeout(()=>{
      if(lives<=0) endGame("목숨을 모두 잃었습니다!");
      else {
        newQuestionSet();
        showQuestion();
      }
    },2500);
  }
}

function stageClear() {
  if(gameOver || won) return;
  inQuiz=false;
  keys={};
  quizEl.style.display="none";
  stageButtons.style.display="block";

  if(stage<MAX_STAGE) {
    messageEl.textContent=`🎉 ${stage} 스테이지 탈출 성공!`;
    nextStageButton.style.display="inline-block";
    nextStageButton.textContent="다음 스테이지 가기";
  } else {
    won=true;
    clearInterval(timerId);
    clearInterval(moveInterval);
    messageEl.textContent="🏆 축하합니다! 10개 스테이지를 모두 클리어했습니다!";
    nextStageButton.style.display="none";
    ctx.fillStyle="rgba(0,120,0,.88)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="white";
    ctx.font="bold 34px Arial";
    ctx.textAlign="center";
    ctx.fillText("ALL STAGES CLEAR!",canvas.width/2,canvas.height/2);
    ctx.textAlign="start";
  }
}

function nextStage() {
  if(gameOver || won || stage>=MAX_STAGE) return;

  stage++;

  // 스테이지별 목숨과 시간 초기화
  lives=getStageLives(stage);
  timeLeft=getStageTime(stage);

  inQuiz=false;
  keys={};
  clearTimeout(feedbackTimeout);

  stageButtons.style.display="none";
  quizEl.style.display="none";

  messageEl.textContent=
    `${stage} 스테이지 시작! 목숨 ${lives}개, 제한 시간 ${timeLeft/60}분!`;

  makeMaze();
  draw();
  updateInfo();

  // 이전 타이머를 종료하고 새 시간으로 타이머 시작
  startTimer();
  startMovement();
}

function endGame(reason) {
  if(gameOver || won) return;
  gameOver=true;
  inQuiz=false;
  clearInterval(timerId);
  clearInterval(moveInterval);
  quizEl.style.display="none";
  stageButtons.style.display="none";
  messageEl.textContent="게임 종료: "+reason;
  ctx.fillStyle="rgba(0,0,0,.8)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";
  ctx.font="bold 36px Arial";
  ctx.textAlign="center";
  ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2);
  ctx.textAlign="start";
}

function resetGame() {
  clearInterval(timerId);
  clearInterval(moveInterval);
  clearTimeout(feedbackTimeout);

  stage=1;
  lives=getStageLives(stage);
  timeLeft=getStageTime(stage);
  gameOver=false;
  won=false;
  inQuiz=false;
  keys={};
  questionIndex=0;

  quizEl.style.display="none";
  stageButtons.style.display="none";

  makeMaze();
  messageEl.textContent="미로를 탈출하세요!";
  draw();
  updateInfo();
  startTimer();
  startMovement();
}

document.addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d","W","A","S","D"].includes(e.key)) keys[e.key]=true;
});
document.addEventListener("keyup",e=>{keys[e.key]=false;});
window.addEventListener("blur",()=>{keys={};});

nextStageButton.addEventListener("click",nextStage);

// 모바일 화면 이동 버튼: 누르고 있는 동안 연속 이동
const touchKeyMap = {up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight"};
document.querySelectorAll("#touchControls button").forEach(button => {
  const key = touchKeyMap[button.dataset.dir];
  const press = event => { event.preventDefault(); keys[key] = true; };
  const release = event => { event.preventDefault(); keys[key] = false; };
  button.addEventListener("pointerdown", press);
  button.addEventListener("pointerup", release);
  button.addEventListener("pointerleave", release);
  button.addEventListener("pointercancel", release);
});
document.getElementById("restart").addEventListener("click",resetGame);

resetGame();
})();
</script>

<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
}
</script>
